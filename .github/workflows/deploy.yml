# deploy-main4 에 push 하면: 타입 검사·백엔드 테스트·빌드 → 그 커밋을 서버에 배포 → 서버 SHA·외부 HTTPS 확인.
# 다른 브랜치에서는 실행되지 않는다. 배포 키는 production 환경(deploy-main4 전용)의 Secret 에만 있다.
# 서버 쪽 잠금·백업·이전 커밋 거부·실패 시 복구는 /usr/local/sbin/hanwha-dx-ci-deploy (deploy/ci/) 가 맡는다.
name: deploy

on:
  push:
    branches: [deploy-main4]
  workflow_dispatch:
    inputs:
      sha:
        description: "되돌릴 커밋 SHA(40자리). 비워 두면 deploy-main4 최신 커밋을 검사 후 다시 배포"
        required: false
        default: ""

permissions:
  contents: read

env:
  PUBLIC_URL: https://dx.165-245-178-152.sslip.io
  ADMIN_URL: https://admin.165-245-178-152.sslip.io

jobs:
  checks:
    name: 타입 검사 · 테스트 · 빌드
    # 롤백(특정 SHA 지정)은 이미 배포됐던 커밋이라 검사를 다시 하지 않는다.
    if: github.ref == 'refs/heads/deploy-main4' && (github.event_name == 'push' || github.event.inputs.sha == '')
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: 프론트 의존성
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: 타입 검사 (tsc --noEmit)
        working-directory: frontend
        run: npm run lint
      - name: 프론트 빌드
        working-directory: frontend
        run: |
          npm run build
          if grep -rlE 'https?://(127\.0\.0\.1|localhost)(:[0-9]+)?' dist --include='*.js' --include='*.html'; then
            echo "::error::빌드본에 localhost 주소가 있습니다"; exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: 백엔드 의존성 (CPU torch)
        working-directory: backend
        run: |
          TORCH=$(grep -E '^torch==' requirements.txt | cut -d'#' -f1 | tr -d ' ')
          pip install "$TORCH" --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: 백엔드 테스트 (전체 실행, 알려진 실패만 허용)
        working-directory: backend
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/run_ci_tests.py

  deploy:
    name: 서버 배포
    needs: checks
    if: >-
      always() && github.ref == 'refs/heads/deploy-main4' &&
      (needs.checks.result == 'success' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.sha != '' && needs.checks.result == 'skipped'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment:
      name: production
      url: ${{ env.PUBLIC_URL }}
    # 배포는 하나씩. 진행 중인 배포는 취소하지 않고, 대기 중인 이전 커밋 배포는 더 새 커밋이 오면 대체된다.
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    steps:
      - name: 배포 대상
        id: target
        env:
          INPUT_SHA: ${{ github.event.inputs.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ -n "$INPUT_SHA" ]; then
            echo "action=rollback" >> "$GITHUB_OUTPUT"; echo "sha=$INPUT_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "action=deploy" >> "$GITHUB_OUTPUT"; echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi
          TARGET=${INPUT_SHA:-$GITHUB_SHA}
          echo "$TARGET" | grep -Eq '^[0-9a-f]{40}$' || { echo "::error::SHA 는 40자리 소문자 16진수"; exit 1; }

      - name: SSH 준비 (전용 키 · 호스트 키 고정)
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::Secret DEPLOY_SSH_KEY 가 없습니다 (production 환경)"; exit 1; }
          [ -n "$DEPLOY_KNOWN_HOSTS" ] || { echo "::error::Variable DEPLOY_KNOWN_HOSTS 가 없습니다"; exit 1; }
          [ -n "$DEPLOY_HOST" ] || { echo "::error::Variable DEPLOY_HOST 가 없습니다"; exit 1; }
          install -d -m 700 ~/.ssh
          # Windows 메모장에서 붙여 넣으면 줄 끝이 CRLF 라 OpenSSH 가 키를 읽지 못한다. \r 을 지우고 마지막 줄바꿈을 보장한다.
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' | sed '/^$/d' > ~/.ssh/deploy_key
          # 줄바꿈이 공백으로 바뀌어 한 줄로 붙은 경우 원래 형식(머리줄·본문·꼬리줄)으로 되돌린다.
          if [ "$(wc -l < ~/.ssh/deploy_key)" -eq 1 ] && grep -q 'BEGIN OPENSSH PRIVATE KEY-----.*-----END' ~/.ssh/deploy_key; then
            sed -e 's/-----BEGIN OPENSSH PRIVATE KEY----- */-----BEGIN OPENSSH PRIVATE KEY-----\n/' \
                -e 's/ *-----END OPENSSH PRIVATE KEY-----/\n-----END OPENSSH PRIVATE KEY-----/' ~/.ssh/deploy_key \
              | awk 'NR==1 || /^-----END/ {print; next} {gsub(/ /, "\n"); print}' > ~/.ssh/deploy_key.fixed
            mv ~/.ssh/deploy_key.fixed ~/.ssh/deploy_key
          fi
          chmod 600 ~/.ssh/deploy_key
          # 키가 읽히는지 확인하고, 비밀이 아닌 공개키 지문만 남긴다 (서버에 등록된 Actions 키와 비교용).
          if ! ssh-keygen -y -f ~/.ssh/deploy_key > ~/.ssh/deploy_key.pub 2>/dev/null; then
            # 값 자체는 출력하지 않고 형식만 알려준다.
            K=~/.ssh/deploy_key
            echo "::warning title=DEPLOY_SSH_KEY 형식 점검::줄 수=$(wc -l < $K), 첫 줄이 BEGIN=$(head -1 $K | grep -q '^-----BEGIN OPENSSH PRIVATE KEY-----$' && echo 예 || echo 아니오), 마지막 줄이 END=$(tail -1 $K | grep -q '^-----END OPENSSH PRIVATE KEY-----$' && echo 예 || echo 아니오), 공개키 형식(ssh-ed25519 ...)=$(grep -q '^ssh-' $K && echo 예 || echo 아니오), 다른 형식 머리줄=$(grep -o '^-----BEGIN [A-Z ]*-----' $K | head -1 || true)"
            echo "::error::DEPLOY_SSH_KEY 를 개인키로 읽을 수 없습니다. hanwha_dx_actions(.pub 아님) 파일 전체를 BEGIN 줄부터 END 줄까지 넣었는지 확인하세요"; exit 1
          fi
          echo "Actions 키 지문: $(ssh-keygen -lf ~/.ssh/deploy_key.pub | cut -d' ' -f2)"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host deploy-target"
            echo "  HostName $DEPLOY_HOST"
            echo "  User deployer"
            echo "  IdentityFile ~/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
            echo "  BatchMode yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config

      - name: 배포 (서버 잠금 대기 → 백업 → 배포 → 확인 → 실패 시 이전 커밋 복구)
        run: |
          set -o pipefail
          ssh deploy-target "${{ steps.target.outputs.action }} ${{ steps.target.outputs.sha }}" | tee deploy.log

      - name: 서버 배포 SHA 확인
        run: |
          DEPLOYED=$(ssh deploy-target status | sed -n 's/^deployed=//p')
          echo "Actions: ${{ steps.target.outputs.sha }}"
          echo "서버:    $DEPLOYED"
          if grep -q '^result=skipped-older' deploy.log; then
            echo "::notice::더 새 커밋($DEPLOYED)이 이미 배포되어 이 커밋은 건너뛰었습니다"
          elif [ "$DEPLOYED" != "${{ steps.target.outputs.sha }}" ]; then
            echo "::error::서버 커밋이 대상과 다릅니다"; exit 1
          fi
          echo "deployed=$DEPLOYED" >> "$GITHUB_STEP_SUMMARY"

      - name: 외부 HTTPS 확인 (Actions 러너에서)
        run: |
          curl -fsS --retry 3 --retry-delay 5 "$PUBLIC_URL/health"
          MODE=$(curl -fsS "$PUBLIC_URL/api/deploy-mode"); echo "$MODE"
          echo "$MODE" | grep -q '"read_only":true' || { echo "::error::관람객 읽기 전용이 아닙니다"; exit 1; }
          echo "$MODE" | grep -q '"ocr_enabled":false' || { echo "::error::서버 OCR 차단이 꺼졌습니다"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST "$PUBLIC_URL/api/parts")" = 403 ] || { echo "::error::관람객 변경 요청이 막히지 않습니다"; exit 1; }
          [ "$(curl -s -o /dev/null -w '%{http_code}' "$ADMIN_URL/")" = 401 ] || { echo "::error::관리자 주소 인증이 없습니다"; exit 1; }
          curl -fsS "$PUBLIC_URL/" | grep -q '<div id="root">'
          echo "외부 확인 통과: $PUBLIC_URL" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 키 삭제
        if: always()
        run: rm -f ~/.ssh/deploy_key
